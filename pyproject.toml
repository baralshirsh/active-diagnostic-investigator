[project]
name = "active-diagnostic-investigator"
version = "0.1.0"
description = "A local-first, cloud-ready multi-agent system for active industrial fault diagnosis under partial observability."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]
[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # import sorting
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # formatter owns line wrapping
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=active_diagnostic_investigator",
    "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = ["active_diagnostic_investigator"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 0

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
exclude_gitignore = true
mypy_path = "src"
explicit_package_bases = true

files = [
    "src/active_diagnostic_investigator",
    "tests",
]